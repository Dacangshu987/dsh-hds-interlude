# dsh-hds-interlude 配置示例（**默认值全量**）
#
# 这份文件由 `scripts/gen-example-yml.mjs` 从 `lib/schema.js` **生成**，
# 所以字段名与默认值一定与插件一致。改了 schema 之后重新跑一次：
#
#   node scripts/gen-example-yml.mjs
#
# 用法：把下面 `- id: hds-interlude` 那一段整块粘进 profile 的
# `cordis.patch.yml`（通常位于 `~/.dsh/profiles/<profile>/cordis.patch.yml`），
# 按需改值。**只写你想改的字段也可以**——没写的用默认值。
#
# 凭据（`im.secretRef`）只写**引用名**，真正的值放在 DSH 的凭据服务里：
#   dsh credentials set DSH_QQBOT_APP_SECRET
#
# 分享码导入（presetSync）见文件末尾；它需要**公网可达**的分享站地址——
# 本插件的出站有 SSRF 防护，指向内网地址会被拦下。

- id: hds-interlude
  name: dsh-hds-interlude
  config:
    # 总开关。
    enabled: true

    # 角色所在 IANA 时区。
    timeZone: Asia/Shanghai

    # 距上次互动超过多少分钟才在幕间块里提示「过了多久」。
    gapNoticeMinutes: 30

    # 每回合都注入当前时间。
    alwaysReportTime: false

    # 替换常驻行为规则段（留空用内置文本）。
    rules: ''

    # 主体叙事提示词（可整体替换；留空用默认）。
    mainPrompt: ''

    # 输出格式附加说明（不能移除工具调用与分条合约）。
    formatPrompt: ''

    # 插件所有者配置的附加固定指令。
    fixedPrompt: ''

    # 文风指令（只作用于剧本散文）。
    stylePrompt: ''

    # 故事档案：主角、世界、关系、地点、时区与文风。
    story:
      characterName: ''
      characterProfile: ''
      perspective: ''
      perspectives: []
      supplementaryFacts: []
      userProfile: ''
      relationship: ''
      location: ''
      supportingCast: ''
      style: ''
      storyTimezone: ''
      character:
        name: Unnamed character
        profile: ''
        speech: ''
      world:
        setting: ''
        location: ''
        supportingCast: ''
      counterpart:
        profile: ''
        initial: ''
      plot:
        startingPoint: ''
        style: 现实主义日常叙事，情绪克制，关系变化缓慢而具体。
        boundaries: ''
        keywords: []

    # 对话节奏与自动生活推进（写故事 / 发消息是两条独立节奏）。
    runtime:
      roleplayOnly: true
      autoAdvanceEnabled: true
      autoAdvanceIntervalMinutes: 40
      autoAdvanceJitterMinutes: 5
      conversationFollowUpMinutes:
        - 10
        - 20
      conversationFollowUpJitterMinutes: 1
      userMessageDebounceSeconds: 2
      minimumAdvanceMinutes: 30
      contextEntryLimit: 35
      contextTimeWindowMinutes: 45
      memoryLimit: 20
      repetitionGuard: true
      restWindows:
        - enabled: true
          label: night sleep
          start: '23:00'
          end: '07:00'
          minIntervalMinutes: 120
          maxIntervalMinutes: 240

    # 主动联系边界（到期待办时角色会不会自己开口）。
    proactive:
      enabled: true
      checkIntervalMinutes: 5
      graceMinutes: 1
      maxPerDay: 6
      duringSleep: false
      duringSleepPromises: true
      wakeIdleSessions: true
      commitmentBackstop: true
      vagueCommitmentMinutes: 10
      tomorrowCommitmentMinutes: 720

    # 主体行动窗口（日程负荷 / 隐私 / 设备可用性）。
    agency:
      enabled: true
      maxWindowMinutes: 240
      minimumProactiveIntervalMinutes: 60
      contactMode: strict
      naturalMinimumIntervalMinutes: 30
      maxCandidateHours: 24

    # 情绪偏移追踪。
    alterSystem:
      enabled: true
      baseThreshold: 10
      densityFactor: 0.3
      sameDirectionBoost: 0.05
      oppositeDecay: 0.15
      minWeight: 0.2
      maxIntensity: 2

    # 近期日程层（周规律 + 日期例外）。
    schedulePreplan:
      enabled: true
      horizonDays: 14
      variationLevel: stable
      candidateActivationProbability: 0.25
      candidateRevealMinutes: 120
      reviewAfterLocalHour: 3
      anchorAutoAdvance: true

    # Urge 弹性推进（可选，替代固定间隔）。
    urge:
      enabled: false
      frequency: medium
      proactiveWillingnessThreshold: 0.4
      advanced:
        hotMin: 10
        hotMax: 20
        idleMin: 35
        idleMax: 55
        burstMin: 3
        burstMax: 7
        slowMin: 110
        slowMax: 130
        halfLifeMinutes: 45
        burstThreshold: 0.75
        jitter: 0.15
        extremeChance: 0.03
        burstTtlMinutes: 35
        burstBudget: 3
        burstContactMinMinutes: 5

    # 时间导演（自动推进时生成事件账本对齐时间线）。
    timelineDirector:
      enabled: false

    # 长线叙事催化器（实验，默认关）。
    longHorizon:
      enabled: false
      triggerScore: 25
      reviewIncrement: 40
      privateWeight: 1
      groupWeight: 0.5
      intensity: subtle

    # 日志级别与内容脱敏。
    logging:
      level: info
      verbosity: standard
      format: layered
      colors: true
      colorTheme: dark
      kaomoji: true
      logScriptPreview: false
      logMessageContent: false
      previewLength: 500

    # 失明模式（沉浸运行：静默日志，只留健康心跳）。
    blindMode:
      enabled: false
      healthReportMinutes: 10

    # 预设同步：从分享站按分享码拉取配置导入（默认关）。
    presetSync:
      enabled: false
      baseUrl: https://typ0.space
      shareCode: ''
      autoUpdate: false
      sections: []
      applyToCurrentStory: false

    # 旧名，等价于 blindMode.enabled（保留读取旧配置）。
    blackBox: false

    # 聊天软件通道（内置 QQ）。**凭据只存引用名，值留在凭据服务里。**
    im:
      enabled: false
      botId: qq
      appId: ''
      secretRef: DSH_QQBOT_APP_SECRET
      bots: []
      markdownSupport: false
      exposeService: false
      botCommands: true
      sayFallback: strict
      sayTool: interlude_say
      imageTool: interlude_send_image
      imagesEnabled: true
      stickerDir: ''
      catalogLimit: 40
      maxFileSizeMB: 10
      harvestInbound: true
      faceEnabled: true
      allowedNativeFaces:
        - smile
        - laugh
        - sweat
        - awkward
      expressionThreshold: 0.7
      autoCreateSession: true
      agentPreset: ''
      cwd: ''
      migrateLegacyBindings: true
      inboundPrefix: true
      botId_legacy: ''
      targetId: ''
      autoDiscover: true
      autoMessage: true
      messageIntervalMinutes: 120
      deliverAutoAdvance: true
      waitForTurnMs: 90000
      timeoutMs: 15000
      keepPassive: false
      dedupe:
        ttlMinutes: 10
        maxEntries: 2000
      forwardLimits:
        maxNodes: 30
        maxCharacters: 8000
        maxDepth: 3
      crossConversation:
        enabled: false
        whitelist: []
        maxPerTurn: 1
      interactive:
        enabled: true
        requireInbound: true
        replyWindowMinutes: 30
      proactive:
        maxPerDay: 30
        minIntervalMinutes: 1
      group:
        enabled: true
        mentionOnly: true
        willingness:
          enabled: false
          threshold: 0.24
          probabilityAmplifier: 1.3
          decayHalfLifeSeconds: 180
          replyCost: 0.55
          baseGain: 0.12
          quoteGain: 0.12
          keywordGain: 0.18
          keywords: []
          minReplyIntervalSeconds: 0
        willingnessPreset: 'off'
        willingnessAuto:
          busy: quiet
          idle: active
          asleep: quiet
      worldSeeder:
        enabled: false
        cadenceMinutes: 45
        maxPending: 4
        dailyCap: 4
        maxHorizonHours: 72
        temperature: 0.9
        maxTokens: 1000
        timeout: 60000
        blockedNames: []
      logLevel: info
      specialization:
        mode: auto
        modelProbe: ''
      chunking:
        splitReplyMessages: true
        messageSeparator: <sep/>
        convertNewlineToSeparator: false
        enabled: true
        maxChars: 40
        maxMessages: 4
        minIntervalMs: 400
        typingBaseDelaySeconds: 1
        typingCharactersPerSecond: 8
        typingMaxDelaySeconds: 12
        typingJitterRatio: 0.3
